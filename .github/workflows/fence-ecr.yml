name: Build and Push Fence to ECR

# Releases are numbered git tags (vMAJOR.MINOR.PATCH, for example v1.4.0).
# A release tag pushes the image as :<tag> and moves :latest.
# A manual run builds the chosen ref as :<commit sha> only and leaves :latest alone.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

concurrency:
  group: ecr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag, and Push Image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: onepick/fence-service
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          IMAGE=$ECR_REGISTRY/$ECR_REPOSITORY
          if [ "$REF_TYPE" = "tag" ]; then
            docker build -t "$IMAGE:$REF_NAME" -t "$IMAGE:latest" .
            docker push "$IMAGE:$REF_NAME"
            docker push "$IMAGE:latest"
          else
            docker build -t "$IMAGE:$COMMIT_SHA" .
            docker push "$IMAGE:$COMMIT_SHA"
          fi
